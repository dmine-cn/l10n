<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGES.about.pageTitle}}</title>
  <meta name="description" content="{{PAGES.about.metaDescription}}">
  <meta name="keywords" content="{{PAGES.about.metaKeywords}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.dmine.cn/{{PREFIX}}about.html">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/about.css">

  <!-- hreflang -->
  {{HREFLANG}}

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.dmine.cn/{{PREFIX}}about.html">
  <meta property="og:title" content="{{PAGES.about.pageTitle}}">
  <meta property="og:description" content="{{PAGES.about.metaDescription}}">
  <meta property="og:image" content="https://www.dmine.cn/icons/Icon-512.png">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:site_name" content="{{META.siteName}}">
</head>
<body>
{{INCLUDE_NAV}}

  <div class="container">
    <header>
      <h1>{{PAGES.about.headerTitle}}</h1>
      <p>{{PAGES.about.headerSubtitle}}</p>
    </header>

    {{SECTIONS}}

    <div class="cta">
      <a href="/index.html?lang={{LANG_CODE}}">{{PAGES.about.ctaText}}</a>
    </div>

{{INCLUDE_FOOTER}}
  </div>
</body>
</html>
