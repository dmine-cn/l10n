<!DOCTYPE html>
<html lang="{{LANG_ATTR}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGES.tips.pageTitle}}</title>
  <meta name="description" content="{{PAGES.tips.metaDescription}}">
  <meta name="keywords" content="{{PAGES.tips.metaKeywords}}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.dmine.cn/{{PREFIX}}tips.html">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/tips.css">

  <!-- hreflang -->
  {{HREFLANG_TIPS}}

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://www.dmine.cn/{{PREFIX}}tips.html">
  <meta property="og:title" content="{{PAGES.tips.pageTitle}}">
  <meta property="og:description" content="{{PAGES.tips.metaDescription}}">
  <meta property="og:image" content="https://www.dmine.cn/icons/Icon-512.png">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:site_name" content="{{META.siteName}}">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/index.html?lang={{LANG_CODE}}" class="navbar-logo"><img src="/icons/Icon-32.png" alt="DMine"></a>
      <a href="/index.html?lang={{LANG_CODE}}">{{NAV.home}}</a>
      <a href="rules.html">{{NAV.rules}}</a>
      <a href="tips.html" class="active">{{NAV.tips}}</a>
      <a href="about.html">{{NAV.about}}</a>
      <a href="download.html">{{NAV.download}}</a>
      <div class="lang-switch">
        <select onchange="location.href=this.value">
          {{LANG_DROPDOWN}}
        </select>
      </div>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>{{PAGES.tips.headerTitle}}</h1>
      <p>{{PAGES.tips.headerSubtitle}}</p>
      <div class="sub">{{PAGES.tips.headerSub2}}</div>
    </header>

    {{TIPS_SECTIONS}}

    <div class="cta">
      <a href="/index.html?lang={{LANG_CODE}}">{{PAGES.tips.ctaText}}</a>
    </div>

    <footer>
      <p>{{FOOTER.copyright}}</p>
    </footer>
  </div>
</body>
</html>
